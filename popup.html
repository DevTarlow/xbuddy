<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Buddy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #111318;
      color: #e1e3e6;
      padding: 16px;
      font-size: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
    }
    .title span {
      margin-right: 4px;
    }

    .llm-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #8a8f9a;
    }

    .llm-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a4d55;
      transition: background 0.3s ease;
    }

    .llm-status .dot.connected {
      background: #00ff41;
      box-shadow: 0 0 6px rgba(0, 255, 65, 0.5);
    }

    .llm-status .dot.offline {
      background: #ff4646;
      box-shadow: 0 0 6px rgba(255, 70, 70, 0.4);
    }

    /* --- Toggle Switch --- */
    .toggle {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #2a2d35;
      border-radius: 20px;
      transition: background 0.3s;
    }

    .toggle .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      bottom: 2px;
      background: #6a6e79;
      border-radius: 50%;
      transition: transform 0.3s, background 0.3s;
    }

    .toggle input:checked + .slider {
      background: #00ff41;
    }

    .toggle input:checked + .slider::before {
      transform: translateX(16px);
      background: #111318;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .input-row input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #2a2d35;
      background: #1a1d23;
      color: #e1e3e6;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: #00ff41;
    }

    .input-row input::placeholder {
      color: #5a5e67;
    }

    .input-row button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      background: #00ff41;
      color: #111318;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }

    .input-row button:hover {
      background: #00cc34;
    }

    .input-row button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .section-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .section-header .toggle {
      margin-top: 1px;
    }

    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6a6e79;
      font-weight: 600;
    }

    .section-label.positive {
      color: #00ff41;
    }

    .section-label.negative {
      color: #ff4646;
    }

    .section-hint {
      font-size: 11px;
      color: #6a6e79;
      margin-top: 3px;
      line-height: 1.35;
    }

    .separator {
      border: none;
      border-top: 1px solid #2a2d35;
      margin: 18px 0;
    }

    .feature-disabled {
      opacity: 0.5;
    }

    .keyword-section {
      min-width: 0;
    }

    .search-wrapper {
      position: relative;
      margin-bottom: 8px;
    }

    .search-input {
      width: 100%;
      padding: 6px 28px 6px 10px;
      border-radius: 6px;
      border: 1px solid #2a2d35;
      background: #1a1d23;
      color: #e1e3e6;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #00ff41;
    }

    .search-input::placeholder {
      color: #5a5e67;
    }

    .search-clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #ff4646;
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      display: none;
      z-index: 1;
    }

    .search-clear:hover {
      color: #ff6b6b;
    }

    .search-clear.visible {
      display: block;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 2px 0 6px;
    }

    .pagination button {
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #2a2d35;
      background: #1a1d23;
      color: #e1e3e6;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .pagination button:hover:not(:disabled) {
      background: #2a2d35;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pagination span {
      font-size: 12px;
      color: #8a8f9a;
      min-width: 80px;
      text-align: center;
    }

    .keyword-list {
      list-style: none;
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 6px;
    }

    .keyword-list::-webkit-scrollbar {
      width: 4px;
    }

    .keyword-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .keyword-list::-webkit-scrollbar-thumb {
      background: #2a2d35;
      border-radius: 4px;
    }

    .keyword-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      margin-bottom: 4px;
      background: #1a1d23;
      border-radius: 6px;
      font-size: 13px;
    }

    .keyword-item .keyword-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keyword-item .delete-btn {
      background: none;
      border: none;
      color: #6a6e79;
      font-size: 16px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      transition: color 0.2s;
    }

    .keyword-item .delete-btn:hover {
      color: #ff4646;
    }

    .empty-state {
      text-align: center;
      color: #5a5e67;
      font-size: 12px;
      padding: 14px 0;
    }

    .btn-outline {
      width: 100%;
      margin-top: 2px;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #2a2d35;
      background: transparent;
      color: #8a8f9a;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .btn-outline:hover {
      background: #1a1d23;
      color: #e1e3e6;
    }

    .btn-outline-danger {
      border-color: #5a1a1a;
      color: #ff6b6b;
    }

    .btn-outline-danger:hover {
      background: #2a0a0a;
      color: #ff4444;
    }

    .collapsible {
      margin-top: 2px;
    }

    .collapsible-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 0;
      background: none;
      border: none;
      color: #e1e3e6;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }

    .collapsible-header:hover {
      color: #00ff41;
    }

    .collapsible-arrow {
      font-size: 10px;
      transition: transform 0.2s;
    }

    .collapsible-body {
      overflow: hidden;
      max-height: 600px;
      transition: max-height 0.3s ease;
    }

    .collapsible-body.collapsed {
      max-height: 0;
    }

    .settings-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6a6e79;
      margin-bottom: 8px;
    }

    .input-row input[type="color"] {
      flex: 0 0 48px;
      width: 48px;
      height: 34px;
      padding: 2px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1d23;
      color: #e1e3e6;
      border: 1px solid #2a2d35;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.error {
      background: #ff4646;
      color: #fff;
      border-color: #ff4646;
    }
    .toast.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <label class="toggle" title="Enable or disable X Buddy">
        <input type="checkbox" id="master-toggle" checked aria-label="Enable X Buddy" />
        <span class="slider"></span>
      </label>
      <div class="title"><span>✨</span> X Buddy</div>
    </div>
    <div class="llm-status" id="llm-status">
      <span class="dot" id="llm-dot"></span>
      <span id="llm-label">Checking…</span>
    </div>
  </div>

  <div id="controls">
    <section class="keyword-section" id="positive-section">
      <div class="section-header">
        <label class="toggle" title="Enable positive highlighting">
          <input type="checkbox" id="positive-toggle" checked aria-label="Enable positive highlighting" />
          <span class="slider"></span>
        </label>
        <div class="section-heading">
          <div class="section-label positive">Positive Keywords</div>
          <div class="section-hint">Posts matching these keywords glow.</div>
        </div>
      </div>
      <div class="input-row">
        <input type="text" id="keyword-input" placeholder="Add a keyword…" />
        <button id="add-btn">Add</button>
      </div>
      <div class="search-wrapper">
        <input type="text" class="search-input" id="positive-search" placeholder="Search keywords…" />
        <button class="search-clear" id="positive-search-clear" title="Clear search" aria-label="Clear positive keyword search">&times;</button>
      </div>
      <ul class="keyword-list" id="keyword-list" role="list" aria-label="Positive keywords"></ul>
      <div class="pagination" id="positive-pagination" style="display:none">
        <button id="positive-prev-btn" title="Previous page">&larr; Prev</button>
        <span id="positive-page-info">Page 1 of 1</span>
        <button id="positive-next-btn" title="Next page">Next &rarr;</button>
      </div>
      <div class="empty-state" id="empty-state">No positive keywords yet.</div>
      <button class="btn-outline btn-outline-danger" id="clear-positive-btn">Clear All</button>
    </section>

    <hr class="separator" />

    <section class="keyword-section" id="negative-section">
      <div class="section-header">
        <label class="toggle" title="Enable negative filtering">
          <input type="checkbox" id="negative-toggle" checked aria-label="Enable negative filtering" />
          <span class="slider"></span>
        </label>
        <div class="section-heading">
          <div class="section-label negative">Negative Keywords</div>
          <div class="section-hint">Posts matching these keywords are hidden.</div>
        </div>
      </div>
      <div class="input-row">
        <input type="text" id="negative-keyword-input" placeholder="Add a negative keyword…" />
        <button id="negative-add-btn">Add</button>
      </div>
      <div class="search-wrapper">
        <input type="text" class="search-input" id="negative-search" placeholder="Search keywords…" />
        <button class="search-clear" id="negative-search-clear" title="Clear search" aria-label="Clear negative keyword search">&times;</button>
      </div>
      <ul class="keyword-list" id="negative-keyword-list" role="list" aria-label="Negative keywords"></ul>
      <div class="pagination" id="negative-pagination" style="display:none">
        <button id="negative-prev-btn" title="Previous page">&larr; Prev</button>
        <span id="negative-page-info">Page 1 of 1</span>
        <button id="negative-next-btn" title="Next page">Next &rarr;</button>
      </div>
      <div class="empty-state" id="negative-empty-state">No negative keywords yet.</div>
      <button class="btn-outline btn-outline-danger" id="clear-negative-btn">Clear All</button>
    </section>

    <hr class="separator" />

    <div class="collapsible">
      <button class="collapsible-header" id="settings-toggle" aria-expanded="false">
        <span>Settings</span>
        <span class="collapsible-arrow" id="settings-arrow">▶</span>
      </button>
      <div class="collapsible-body collapsed" id="settings-body">
        <div class="settings-label" style="margin-top: 10px;">Glow Color:</div>
        <div class="input-row" style="margin-bottom: 4px;">
          <input type="color" id="glow-color-input" value="#00ff41" aria-label="Glow color" />
          <button id="save-glow-color-btn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
